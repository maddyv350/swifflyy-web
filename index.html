<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Google Tag Manager -->
    <script>

          j = d.createElement(s),

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbf8f1" />

    <title>Swifflyy — Meet people where you are</title>
    <meta
      name="description"
      content="Swifflyy is a location-first dating app, launching soon city by city. Drop a pin at a place you love, discover people nearby, and connect with people who share your world — not just your algorithm. Join the early-access list."
    />

    <!-- Open Graph / social share -->
    <meta property="og:site_name" content="Swifflyy" />
    <meta property="og:title" content="Swifflyy — Meet people where you are" />
    <meta
      property="og:description"
      content="A location-first dating app, launching soon. Drop a pin. See who's nearby. Connect with people who share your world. Join the early-access list."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://swifflyy.com/" />
    <!-- og:image: the branded card is designed at public/og-image.svg. Major
         scrapers (X/Facebook/LinkedIn) don't render SVG, so rasterize it once to
         a 1200×630 PNG and uncomment below:
             rsvg-convert public/og-image.svg -o public/og-image.png
         (or drop the SVG into any online SVG→PNG tool). Critical for the
         share-driven waitlist — a link with no image gets far fewer clicks.
    <meta property="og:image" content="https://swifflyy.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:image" content="https://swifflyy.com/og-image.png" />
    -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Swifflyy — Meet people where you are" />
    <meta
      name="twitter:description"
      content="A location-first dating app, launching soon. Drop a pin. See who's nearby. Join the early-access list."
    />

    <!-- Privacy-friendly analytics. Create the site in Plausible (or Umami) for
         swifflyy.com, then uncomment to start measuring signup + share rates.
    <script defer data-domain="swifflyy.com" src="https://plausible.io/js/script.js"></script>
    -->


    <!-- Fonts: Bricolage Grotesque (display) · Hanken Grotesk (body) · Caveat (hand) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Caveat:wght@500;600;700&family=Hanken+Grotesk:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap"
