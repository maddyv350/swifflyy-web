<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Bricolage Grotesque','Hanken Grotesk',system-ui,sans-serif">
  <defs>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#1f1d1b" opacity="0.06"/>
    </pattern>
  </defs>

  <!-- paper field -->
  <rect width="1200" height="630" fill="#fbf8f1"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- sketchy inner frame -->
  <rect x="40" y="40" width="1120" height="550" rx="28" fill="none" stroke="#2a2724" stroke-width="3"/>
  <rect x="47" y="47" width="1120" height="550" rx="28" fill="none" stroke="#2a2724" stroke-width="3" opacity="0.25"/>

  <!-- launching-soon tag (hand font approximated) -->
  <text x="96" y="150" font-family="'Caveat',cursive" font-size="40" fill="#d94f3a" transform="rotate(-1.5 96 150)">✦ launching soon</text>

  <!-- headline -->
  <text x="94" y="270" font-size="104" font-weight="800" letter-spacing="-4" fill="#1f1d1b">Meet people</text>
  <text x="94" y="382" font-size="104" font-weight="800" letter-spacing="-4" fill="#d94f3a">where you are</text>
  <!-- doodle underline -->
  <path d="M100 405 C 260 392, 560 392, 700 404" stroke="#d94f3a" stroke-width="7" stroke-linecap="round" fill="none"/>

  <!-- sub -->
  <text x="96" y="470" font-family="'Hanken Grotesk',system-ui,sans-serif" font-size="34" fill="#7a766f">A location-first dating app. Drop a pin. See who’s nearby.</text>

  <!-- wordmark -->
  <text x="96" y="560" font-family="'Caveat',cursive" font-size="56" font-weight="700" fill="#1f1d1b">swifflyy</text>

  <!-- pin badge, top-right -->
  <g transform="translate(1000 150)">
    <circle r="86" fill="#f2c9c0"/>
    <circle r="86" fill="none" stroke="#2a2724" stroke-width="3"/>
    <path d="M0 -46 C -30 -46, -46 -24, -46 -2 C -46 26, 0 60, 0 60 C 0 60, 46 26, 46 -2 C 46 -24, 30 -46, 0 -46 Z" fill="#d94f3a" stroke="#2a2724" stroke-width="3"/>
    <circle cx="0" cy="-2" r="15" fill="#fbf8f1" stroke="#2a2724" stroke-width="3"/>
  </g>
</svg>
